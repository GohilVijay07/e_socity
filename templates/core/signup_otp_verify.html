{% extends 'base.html' %}

{% block title %}Verify Signup OTP{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 560px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <h3 class="mb-2">Verify Your Email OTP</h3>
            <p class="text-muted mb-4">
                We sent a 6-digit OTP to <strong>{{ masked_email }}</strong>. Enter it below to complete signup.
            </p>

            <form method="post" novalidate>
                {% csrf_token %}
                <input type="hidden" name="action" value="verify">
                <div class="mb-3">
                    <label for="id_otp" class="form-label">OTP</label>
                    <input
                        type="text"
                        name="otp"
                        id="id_otp"
                        class="form-control"
                        maxlength="6"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        placeholder="Enter 6-digit OTP"
                        required
                    >
                </div>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="{% url 'signup' %}" class="btn btn-outline-secondary">Back</a>
                    <button type="submit" class="btn btn-success px-4">Verify OTP</button>
                </div>
            </form>

            <hr class="my-4">

            <form method="post" class="d-grid">
                {% csrf_token %}
                <input type="hidden" name="action" value="resend">
                <button type="submit" class="btn btn-outline-primary">Resend OTP</button>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const otpInput = document.getElementById('id_otp');
    if (!otpInput) return;

    otpInput.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 6);
    });
});
</script>
{% endblock %}
