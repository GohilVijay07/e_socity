<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f4ef;
            margin: 0;
            padding: 20px;
            color: #1f2933;
        }
        .card {
            max-width: 560px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 24px;
            border: 1px solid #e2e8f0;
        }
        .otp {
            font-size: 32px;
            letter-spacing: 6px;
            font-weight: 700;
            text-align: center;
            color: #0f766e;
            margin: 20px 0;
        }
        .muted {
            color: #64748b;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Password Reset OTP</h2>
        <p>Use this OTP to reset your password:</p>
        <div class="otp">{{ otp }}</div>
        <p class="muted">This OTP is valid for {{ expiry_minutes }} minutes.</p>
        <p class="muted">If you did not request this, please ignore this email.</p>
    </div>
</body>
</html>
