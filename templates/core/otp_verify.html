{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Verify OTP & Reset Password</h2>
                    <p class="text-muted mb-4">An OTP has been sent to your email. Please enter it below along with your new password.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_otp" class="form-label">Enter OTP (6 digits):</label>
                            <input type="text" name="otp" id="id_otp" class="form-control" maxlength="6" placeholder="123456" required>
                            <small class="form-text text-muted">Check your email for the OTP</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_new_password" class="form-label">New Password:</label>
                            <input type="password" name="new_password" id="id_new_password" class="form-control" required>
                            <small class="form-text text-muted">At least 8 characters</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_confirm_password" class="form-label">Confirm Password:</label>
                            <input type="password" name="confirm_password" id="id_confirm_password" class="form-control" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                    </form>
                    
                    <hr>
                    <p class="text-center mt-3">
                        <a href="{% url 'password_reset' %}">Didn't receive OTP? Request again</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
