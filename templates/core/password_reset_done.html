{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <div class="alert alert-info" role="alert">
                        <h4 class="alert-heading">Email Sent!</h4>
                        <p>We've sent you an email with instructions to reset your password.</p>
                        <hr>
                        <p class="mb-0">Please check your email (including spam folder) to continue.</p>
                    </div>
                    
                    <a href="{% url 'login' %}" class="btn btn-primary">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
