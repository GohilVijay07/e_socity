{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Reset Password with OTP</h2>
                    <p class="text-muted mb-4">Enter your registered email address and we'll send a 6-digit OTP.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_email" class="form-label">Email Address:</label>
                            {{ form.email }}
                            {% if form.email.errors %}
                                <small class="text-danger">{{ form.email.errors.0 }}</small>
                            {% endif %}
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">Send OTP</button>
                    </form>
                    
                    <hr>
                    <p class="text-center mt-3">
                        <a href="{% url 'login' %}">Back to Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
