{% extends 'base.html' %}

{% block title %}Server Error - eSociety Management{% endblock %}

{% block content %}
<div style="max-width: 700px; margin: 80px auto; text-align: center; padding: 40px;">
    <div style="font-size: 5rem; margin-bottom: 20px;">⚠️</div>
    <h1 style="font-size: 2.5rem; color: #d32f2f; margin-bottom: 10px;">Server Error</h1>
    <p style="font-size: 1.2rem; color: #666; margin-bottom: 30px;">
        Something went wrong on our end. We're working to fix it.
    </p>

    <div style="display: flex; gap: 15px; justify-content: center;">
        <a href="{% url 'home' %}" style="padding: 12px 30px; background: #2196f3; color: white; text-decoration: none; border-radius: 4px; font-weight: 600;">
            Go to Home
        </a>
        <a href="{% url 'contact' %}" style="padding: 12px 30px; background: #757575; color: white; text-decoration: none; border-radius: 4px; font-weight: 600;">
            Report Issue
        </a>
    </div>
</div>
{% endblock %}
