{% extends 'socity/admin/admin_base.html' %}
{% block title %}Delete User{% endblock %}
{% block admin_content %}
<h3>Delete User</h3>
<p class="text-muted">Are you sure you want to delete <strong>{{ user_obj.get_full_name|default:user_obj.username }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Confirm Delete</button>
    <a class="btn btn-outline-secondary" href="{% url 'socity:user_list' %}">Cancel</a>
</form>
{% endblock %}
