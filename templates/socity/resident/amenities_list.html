{% extends 'base.html' %}
{% block title %}Amenities{% endblock %}
{% block content %}
<div class="container py-4"><h3>Book Amenities</h3><div class="table-responsive card"><table class="table table-striped mb-0"><thead><tr><th>Amenity</th><th>Description</th><th></th></tr></thead><tbody>{% for a in amenities %}<tr><td>{{ a.name }}</td><td>{{ a.description|default:'-' }}</td><td><a class="btn btn-sm btn-primary" href="{% url 'socity:resident_amenity_book' a.id %}">Book</a></td></tr>{% empty %}<tr><td colspan="3" class="text-center">No amenities available.</td></tr>{% endfor %}</tbody></table></div></div>
{% endblock %}
