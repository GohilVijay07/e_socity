{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="eSociety Management - Building stronger communities">
    <title>{% block title %}eSociety Management{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
    {% include 'navbar.html' %}
    
    <main class="content">
        {% if messages %}
            <div class="flash-messages" role="status" aria-live="polite">
                {% for message in messages %}
                    <div class="flash {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}
    
    <script>
        // Password Toggle Functionality
        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtns = document.querySelectorAll('.password-toggle-btn');
            
            toggleBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const input = this.parentElement.querySelector('input[type="password"], input[type="text"]');
                    
                    if (input.type === 'password') {
                        input.type = 'text';
                        this.textContent = '👁️‍🗨️';
                        this.title = 'Hide password';
                    } else {
                        input.type = 'password';
                        this.textContent = '👁️';
                        this.title = 'Show password';
                    }
                });
            });
        });
    </script>
</body>
</html>
